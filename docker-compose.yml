# USDM4-Assure local stack. `docker compose up` runs the PoC anywhere.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: usdm4-assure:dev
    volumes:
      - ./data:/app/data          # input PDFs + output JSON
      - ./src:/app/src            # live code during dev
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}

  # Conversion API: POST a protocol PDF to /v1/convert, receive its USDM 4.0 JSON (docs/api.md).
  # Set USDM4_API_KEYS before exposing it; without it the service is open.
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: usdm4-assure:dev
    entrypoint: []
    command: uvicorn usdm4_api.app:app_factory --factory --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data          # audit trail + LLM cache persist here
    environment:
      - OPEN_ROUTER_KEY=${OPEN_ROUTER_KEY:-}
      - USDM4_API_KEYS=${USDM4_API_KEYS:-}
      - USDM4_MAX_CONCURRENT=${USDM4_MAX_CONCURRENT:-2}
      - USDM4_ALLOW_NO_LLM=${USDM4_ALLOW_NO_LLM:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    profiles: ["api"]

  # CORE conformance engine — pinned separately; run as a one-shot validation gate.
  # Placeholder: the spike wires cdisc-rules-engine here once the CLI invocation is proven.
  core:
    image: python:3.12-slim
    working_dir: /work
    volumes:
      - ./data:/work/data
    command: ["sleep", "infinity"]   # replaced by CORE engine invocation in spike step 2
    profiles: ["validate"]

  # Certification review UI (Phase 5, task 5.3) — click-to-source crops, audited edits,
  # certification. Localhost only, no auth (docs/review.md). Reuses the app image; the
  # [review] extra (fastapi/uvicorn/jinja2) is dev-installed at start, same as `app`'s
  # live-mounted src, so a rebuild isn't needed while iterating on the UI.
  review:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: usdm4-assure:dev
    entrypoint: []
    command: >
      sh -c "pip install --no-cache-dir -e .[review] &&
             uvicorn usdm4_assure.review.app:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./data:/app/data          # audit stores + source PDFs
      - ./src:/app/src            # live code during dev
      - ./templates:/app/templates
    ports:
      - "8000:8000"
    profiles: ["review"]

# Neo4j (property-graph data layer) was parked here in earlier iterations. It is
# deliberately not scheduled — see PLAN.md's Phase-2+ deferrals — and is not
# represented as a service; add it back only when a phase actually calls for it.
