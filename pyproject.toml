[project]
name = "usdm4-assure"
version = "0.1.0"
description = "AI pipeline converting clinical protocols to conformant USDM 4.0, with an Assurance layer engineered to surpass the market accuracy ceiling."
readme = "README.md"
requires-python = ">=3.11,<3.13"   # SPIKE FINDING: cdisc-rules-engine (via usdm4) has no py3.13 wheel yet
dependencies = [
  "usdm4==0.29.0",          # pinned exact — see PINS.md
  "pydantic>=2.7",
  "pymupdf>=1.24",          # PDF text + coords + page-image render
  "pdfplumber>=0.11",       # table-candidate detection
  "anthropic>=0.40",        # direct Anthropic SDK (fallback path)
  "requests>=2.31",         # OpenRouter gateway (default LLM path)
  "python-dotenv>=1.0",     # load .env (OPEN_ROUTER_KEY)
  "typer>=0.12",            # CLI
  "rich>=13",
  "pyyaml>=6",
  "numpy>=1.26",            # confidence model (assure/confidence.py) + conformal counts
]

[project.optional-dependencies]
# CORE engine ships transitively via usdm4 -> cdisc-rules-engine (USDM4().validate_core()).
dev = ["pytest>=8", "ruff>=0.6", "reportlab>=4.0"]  # reportlab: spike PDF fixture generators
docs = ["mkdocs-material>=9.5"]
# Confidence-model feature table (Phase 4). Optional: assure/features.write_features()
# falls back to JSON Lines when these aren't installed.
eval = ["pandas>=2.0", "pyarrow>=14"]
# Multi-page SoA table structure (Phase 2). Optional: layout/*_adapter.py return
# [] when these are absent, so the deterministic PyMuPDF path always works standalone.
layout = ["docling>=2.0", "mineru>=2.5"]

[project.scripts]
usdm4 = "usdm4_assure.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
# Scope discovery to our own suite. Without this, pytest also tries to collect
# the vendored usdm4/usdm source clones under spikes/_work/ (gitignored, cloned
# for reference/measurement, not meant to run as part of our suite).
testpaths = ["tests"]
