# Section classification taxonomy (task 3.2, docs/ai/archive/DEVPLAN-v0.3-tiered-tasks.md §3-A).
#
# Extracted from the reference extractor's classification logic
# (Rewant's_USDM_Extractor/app/services/protocol_section_graph.py) as config
# data rather than code — the vocabulary a section graph classifier assigns
# to, independent of the (not-yet-ported) classification rules themselves.
#
# Four axes, each assigned independently to a section/chunk:
#   canonical_section_type — coarse top-level section kind
#   section_subtype        — finer content classification within a type
#   authority_surface       — which rendering of the content is authoritative
#                            (e.g. "soa_table_current" vs "soa_table_historic")
#   table_role               — what kind of table this is, if it is one

canonical_section_type:
  - header
  - summary
  - introduction
  - science
  - design
  - population
  - interventions
  - disposition
  - assessments
  - statistics
  - appendix
  - references

